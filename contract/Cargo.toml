[package]
name = "foodsort-contract"
version = "0.1.0"
authors = ["FoodSort NEAR Hackathon 2026 Team"]
edition = "2021"
description = "FoodSort NEAR Smart Contract — Verifiable Food-Sorting Actions & NEP-171 Patronage NFTs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"
near-contract-standards = "5.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
